name: Build and publish store

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sillvy-manga-store
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Missing SIGNING_KEY secret"; exit 1; }
          test -n "$ALIAS" || { echo "Missing ALIAS secret"; exit 1; }
          test -n "$KEY_STORE_PASSWORD" || { echo "Missing KEY_STORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks

      - name: Lint and build release APK
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply
          ./gradlew \
            :src:th:mangazaa:lintRelease \
            :src:th:mangazaa:assembleRelease \
            :src:th:bkkmanga:lintRelease \
            :src:th:bkkmanga:assembleRelease \
            :src:th:mangasuper:lintRelease \
            :src:th:mangasuper:assembleRelease

      - name: Prepare release and store index
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          TAG="extensions"
          ASSETS=()
          for MODULE in mangazaa bkkmanga mangasuper; do
            APK=$(find "src/th/$MODULE/build" -type f -name '*.apk' -print -quit)
            JAR=$(find "src/th/$MODULE/build/outputs/jar/release" -type f -name '*.jar' -print -quit)
            test -n "$APK" || { echo "Missing APK for $MODULE"; exit 1; }
            test -n "$JAR" || { echo "Missing JAR for $MODULE"; exit 1; }
            ASSETS+=("$APK" "$JAR")
          done

          keytool -exportcert -alias "$ALIAS" -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -file /tmp/mangazaa-cert.der
          SIGNING_KEY=$(openssl x509 -inform DER -in /tmp/mangazaa-cert.der -noout -fingerprint -sha256 | cut -d= -f2)
          test -n "$SIGNING_KEY"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Sillvy Manga Extensions" --generate-notes
          fi

          python3 -m pip install --disable-pip-version-check protobuf
          python3 scripts/generate_repo.py \
            --module-dir src/th/mangazaa \
            --module-dir src/th/bkkmanga \
            --module-dir src/th/mangasuper \
            --output /tmp/manga-zaa-store \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --signing-key "$SIGNING_KEY"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish repo branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore .
          git switch --orphan publish-repo
          cp -a /tmp/manga-zaa-store/. .
          printf '# Sillvy Mihon Extension Store\n\nAdd this URL in Mihon:\n\n`https://raw.githubusercontent.com/%s/repo/repo.json`\n' "$GITHUB_REPOSITORY" > README.md
          git add repo.json index.pb index.json index.html icons README.md
          git commit -m "Update extension store ${{ steps.prepare.outputs.tag }}"
          git push --force origin HEAD:repo

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sillvy-manga-${{ steps.prepare.outputs.tag }}
          path: |
            src/th/*/build/**/*.apk
            src/th/*/build/outputs/jar/release/*.jar
